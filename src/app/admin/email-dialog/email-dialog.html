<h2 mat-dialog-title>Votre message</h2>
<mat-dialog-content>
  <quill-editor
    [(ngModel)]="emailBody"
    [modules]="editorModules"
    [readOnly]="isPreview"
    [styles]="{ height: '260px' }"
    placeholder="Saisissez votre message...">
  </quill-editor>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSend()" [disabled]="isBodyEmpty()">
    <mat-icon>send</mat-icon>
    Envoyer
  </button>
</mat-dialog-actions>
