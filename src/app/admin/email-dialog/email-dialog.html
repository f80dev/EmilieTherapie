<h2 mat-dialog-title>Envoyer un email au client</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Message</mat-label>
    <textarea matInput [(ngModel)]="emailBody" rows="6" placeholder="Saisissez votre message..."></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSend()" [disabled]="!emailBody.trim()">
    <mat-icon>send</mat-icon>
    Envoyer
  </button>
</mat-dialog-actions>
