<div class="vertical-card" [class.image-left]="imagePosition === 'left'" [class.image-top]="imagePosition === 'top'">
  <div class="column text-column">
    <ng-content></ng-content>
  </div>

  <div class="column image-column" [style.height]="imagePosition === 'top' ? 'auto' : imageHeight">
    <img [src]="image" class="image-content">
  </div>
</div>
